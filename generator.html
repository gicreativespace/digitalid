<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Digital ID - Free</title>
    
    <link rel="icon" href="data:,">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- html2canvas for Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/generator.css">
</head>
<body>

    <!-- Top Bar -->
    <div class="top-nav">
        <a href="index.html" class="back-btn">← Back</a>
        <button id="settingsBtn" class="settings-icon">⚙️</button>
    </div>

    <div class="generator-container">
        <h1 class="page-title">Create Your Digital ID</h1>
        <p class="page-subtitle">Your Identity, Digitally.</p>

        <div class="generator-layout">
            
            <!-- LEFT SIDE: FORM -->
            <div class="form-section">
                
                <div class="form-group">
                    <label>Profile Photo</label>
                    <div class="photo-buttons">
                        <label for="fileInput" class="btn-upload"><i class="fa-regular fa-image"></i> Upload Photo</label>
                        <input type="file" id="fileInput" accept="image/*" hidden>
                        <label for="cameraInput" class="btn-upload"><i class="fa-solid fa-camera"></i> Camera</label>
                        <input type="file" id="cameraInput" accept="image/*" capture="user" hidden>
                    </div>
                </div>

                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="nameInput" placeholder="Masina Venkata Surendra" oninput="updateCard()">
                </div>

                <div class="form-group">
                    <label>Designation *</label>
                    <input type="text" id="designationInput" placeholder="Creative Soul" oninput="updateCard()">
                </div>

                <div class="form-group">
                    <label>Organization</label>
                    <input type="text" id="orgInput" placeholder="GI Creative Space" oninput="updateCard()">
                </div>

                <div class="form-group">
                    <label>Mobile</label>
                    <input type="text" id="mobileInput" placeholder="+91 8985361991" oninput="updateCard()">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="emailInput" placeholder="surendramasina@gmail.com" oninput="updateCard()">
                </div>

                <div class="form-group">
                    <label>Website</label>
                    <input type="text" id="websiteInput" placeholder="www.gicreativespace.com" oninput="updateCard()">
                </div>

                <!-- Extra Details (Simple) -->
                <div class="form-group">
                    <label>Date of Birth (DOB)</label>
                    <input type="text" id="dobInput" placeholder="01 Jan 1995" oninput="updateCard()">
                </div>

                <div class="form-group">
                    <label>Blood Group</label>
                    <input type="text" id="bloodInput" placeholder="O+" oninput="updateCard()">
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="locationInput" placeholder="Hyderabad" oninput="updateCard()">
                </div>

                <div class="form-group">
                    <label>Skills</label>
                    <input type="text" id="skillsInput" placeholder="UI/UX, Branding" oninput="updateCard()">
                </div>

                <!-- Theme Selector -->
                <div class="form-group">
                    <label>Select Theme</label>
                    <div class="theme-selector">
                        <button class="theme-btn active" data-theme="classic" onclick="setTheme('classic')">Classic</button>
                        <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')">Dark</button>
                        <button class="theme-btn" data-theme="minimal" onclick="setTheme('minimal')">Minimal</button>
                        <button class="theme-btn" data-theme="earthy" onclick="setTheme('earthy')">Earthy</button>
                    </div>
                </div>

                <!-- Colour Options -->
                <div class="form-group">
                    <label>Select Accent Colour</label>
                    <div class="color-selector">
                        <div class="color-swatch active" data-color="green" style="background: #1F3D2B;" onclick="setColor('green')"></div>
                        <div class="color-swatch" data-color="gold" style="background: #C8A96A;" onclick="setColor('gold')"></div>
                        <div class="color-swatch" data-color="navy" style="background: #2C3E50;" onclick="setColor('navy')"></div>
                        <div class="color-swatch" data-color="maroon" style="background: #800000;" onclick="setColor('maroon')"></div>
                        <div class="color-swatch" data-color="charcoal" style="background: #36454F;" onclick="setColor('charcoal')"></div>
                    </div>
                </div>
            </div>

            <!-- RIGHT SIDE: LIVE PREVIEW -->
            <div class="preview-section">
                <div class="sticky-preview">
                    
                    <div id="downloadWrapper" class="download-wrapper">
                        
                        <!-- THE CARD -->
                        <div id="frontCard" class="id-card theme-classic color-green">
                            <div class="card-header">
                                <span class="line"></span> DIGITAL ID <span class="line"></span>
                            </div>
                            
                            <div class="card-photo-container">
                                <img id="cardPhoto" src="https://ui-avatars.com/api/?name=User&background=1F3D2B&color=C8A96A&size=150" alt="Profile">
                            </div>
                            
                            <h2 id="cardName" class="card-name">Your Name</h2>
                            <p id="cardDesignation" class="card-designation">Designation</p>
                            <p id="cardOrg" class="card-org hidden">Organization</p>
                            
                            <div class="card-divider"></div>
                            
                            <div class="card-contact">
                                <p id="cardMobile" class="hidden"><i class="fa-solid fa-phone accent-icon"></i> <span id="mobileText"></span></p>
                                <p id="cardEmail" class="hidden"><i class="fa-solid fa-envelope accent-icon"></i> <span id="emailText"></span></p>
                                <p id="cardWebsite" class="hidden"><i class="fa-solid fa-globe accent-icon"></i> <span id="websiteText"></span></p>
                            </div>
                            
                            <div class="card-divider"></div>
                            
                            <!-- Extra Details -->
                            <div class="card-extra-details">
                                <p id="cardDob" class="hidden"><i class="fa-regular fa-calendar accent-icon"></i> <span id="dobText"></span></p>
                                <p id="cardBlood" class="hidden"><i class="fa-solid fa-droplet accent-icon"></i> <span id="bloodText"></span></p>
                                <p id="cardLocation" class="hidden"><i class="fa-solid fa-location-dot accent-icon"></i> <span id="locationText"></span></p>
                                <p id="cardSkills" class="hidden"><i class="fa-solid fa-wand-magic-sparkles accent-icon"></i> <span id="skillsText"></span></p>
                            </div>
                            
                            <div class="card-divider"></div>
                            
                            <p class="card-tagline">Your Identity, Digitally.</p>
                            <p class="card-branding">An initiative of <span class="valiass-link" onclick="openContactPopup(event)">@valiass</span> team</p>
                        </div>

                    </div>

                    <button id="downloadBtn" class="btn btn-primary" style="margin-top: 16px; width: 100%; max-width: 320px;">Download Card</button>
                </div>
            </div>

        </div>

        <div class="page-footer">
            An initiative of <span class="valiass-link" onclick="openContactPopup(event)">@valiass</span> team
        </div>
    </div>

    <!-- Contact Popup Modal -->
    <div id="contactModal" class="modal hidden">
        <div class="modal-content">
            <h3>Contact @valiass</h3>
            <p>Get in touch with us!</p>
            <div class="contact-buttons">
                <a href="tel:+918985361991" class="btn btn-primary"><i class="fa-solid fa-phone"></i> Call</a>
                <a href="https://wa.me/918985361991" target="_blank" class="btn btn-secondary"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
            </div>
            <button onclick="closeContactPopup()" class="btn close-btn">Close</button>
        </div>
    </div>

    <script src="js/generator.js"></script>
</body>
</html>
